<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Stock AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

<div class="auth-container">
  <h2 id="formTitle">Login to Stock AI</h2>

  <form id="loginForm">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="button" onclick="login()">Login</button>
    <p class="switch">New user? <span onclick="showSignup()">Create account</span></p>
  </form>

  <form id="signupForm" class="hidden">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="button" onclick="signup()">Sign Up</button>
    <p class="switch">Already registered? <span onclick="showLogin()">Login</span></p>
  </form>

  
</div>

<script src="login.js"></script>
</body>
</html>
